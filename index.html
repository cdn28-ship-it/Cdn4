  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      min-height: 100%;
    }

    .video-container {

      position: relative;

      width: 100%;
      max-width: 700px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }


    video {

      display: block;

      width: 100%;
      height: auto;

      background: #000;

      transition:
        filter 0.4s ease,
        opacity 0.4s ease;
    }


    /* BLUR SETELAH 20 DETIK */

    .video-container.locked video {

      filter:
        blur(7px)
        brightness(0.40);
    }


    /* OVERLAY */

    .video-overlay {

      position: absolute;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      gap: 12px;

      padding: 20px;

      background: rgba(0, 0, 0, 0.30);

      z-index: 10;
    }


    .video-container.locked .video-overlay {

      display: flex;
    }


    /* PESAN */

    .sponsor-text {

      color: #fff;

      font-size: 14px;

      text-align: center;

      max-width: 350px;

      line-height: 1.5;
    }


    /* TOMBOL */

    #continueButton {

      padding: 15px 30px;

      border: none;

      border-radius: 10px;

      background: #2196f3;

      color: #fff;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.5);

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }


    #continueButton:hover {

      transform: scale(1.05);

      opacity: 0.95;
    }


    #continueButton:active {

      transform: scale(0.98);
    }

  </style>

<body>


  <div
    class="video-container"
    id="videoContainer"
  >


    <!-- VIDEO -->

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    >

      <source
        src="https://cdn2.videy.co/j0JIPDQb1.mp4"
        type="video/mp4"
      >

      Browser kamu tidak mendukung video HTML5.

    </video>


    <!-- OVERLAY -->

    <div
      class="video-overlay"
      id="videoOverlay"
    >

      <div class="sponsor-text">
        Video dijeda sementara. Klik tombol di bawah untuk membuka
        halaman iklan, lalu kembali ke halaman ini untuk melanjutkan video.
      </div>


      <button id="continueButton">
        ▶ Buka iklan & Lanjut Menonton
      </button>

    </div>


  </div>


  <script>

    const video =
      document.getElementById("videoPlayer");

    const videoContainer =
      document.getElementById("videoContainer");

    const continueButton =
      document.getElementById("continueButton");


    /* ==============================
       DIRECT LINK
       ============================== */

    const directLink =
      "https://www.effectivecpmnetwork.com/jajsmmts?key=3379e30611a4277cdd49864562b580a3";


    /* ==============================
       PENGATURAN
       ============================== */

    const triggerTime = 20;

    let buttonShown = false;

    let sponsorOpened = false;


    /* ==============================
       DETEKSI 20 DETIK
       ============================== */

    video.addEventListener(
      "timeupdate",
      function () {

        if (buttonShown) {
          return;
        }


        if (video.currentTime >= triggerTime) {

          buttonShown = true;

          video.pause();

          videoContainer.classList.add("locked");

        }

      }
    );


    /* ==============================
       KLIK TOMBOL
       ============================== */

    continueButton.addEventListener(
      "click",
      function () {

        sponsorOpened = true;

        /*
         * Buka sponsor di tab baru.
         * Halaman video tetap berada di tab sebelumnya.
         */

        window.open(
          directLink,
          "_blank",
          "noopener,noreferrer"
        );

      }
    );


    /* ==============================
       KETIKA USER KEMBALI
       ============================== */

    document.addEventListener(
      "visibilitychange",
      function () {

        if (
          document.visibilityState === "visible" &&
          sponsorOpened
        ) {

          resumeVideo();

        }

      }
    );


    /* ==============================
       BACK/FORWARD CACHE
       ============================== */

    window.addEventListener(
      "pageshow",
      function () {

        if (sponsorOpened) {

          resumeVideo();

        }

      }
    );


    /* ==============================
       LANJUTKAN VIDEO
       ============================== */

    function resumeVideo() {

      /*
       * Hilangkan blur
       */

      videoContainer.classList.remove("locked");


      /*
       * Sembunyikan overlay
       */

      buttonShown = true;


      /*
       * Coba lanjutkan video
       */

      const playPromise =
        video.play();


      if (
        playPromise !== undefined
      ) {

        playPromise.catch(
          function () {

            /*
             * Beberapa browser membutuhkan
             * interaksi pengguna sebelum autoplay.
             * Kontrol video tetap tersedia.
             */

          }
        );

      }

    }

  </script>
